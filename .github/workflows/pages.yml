name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public releases and pricing snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_catalog.py
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: node --test scripts/browser-language.test.mjs
      - run: node --test scripts/public-download.test.mjs
      - run: node --test scripts/site-language.test.mjs
      - run: npm run build --prefix frontend
      - run: python scripts/assemble.py
      - run: python scripts/check_site.py
      - run: node scripts/check_download.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
